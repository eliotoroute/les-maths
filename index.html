<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⏳</title>
<style>
:root{--bg:#dde6f5;--card:rgba(255,255,255,.34);--text:#14161a;--muted:#4b5563;--track:rgba(255,255,255,.45);--edge:rgba(255,255,255,.75);--shadow:rgba(40,50,120,.2);--shine:rgba(255,255,255,.55);--g1:rgba(255,255,255,.55);--g2:rgba(255,255,255,.16);--gi1:rgba(128,140,255,.82);--gi2:rgba(92,105,232,.76);--green:#22a559;--orange:#f08a00;--red:#e5383b;--accent:#22a559;--blue:#6d7cff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d14;--card:rgba(255,255,255,.08);--text:#f5f6f8;--muted:#a3a9b5;--track:rgba(255,255,255,.14);--edge:rgba(255,255,255,.22);--shadow:rgba(0,0,0,.45);--shine:rgba(255,255,255,.14);--g1:rgba(255,255,255,.22);--g2:rgba(255,255,255,.06)}}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(30px)}
body::before{width:70vmax;height:70vmax;left:-20vmax;top:-20vmax;background:radial-gradient(circle,var(--accent),transparent 65%);opacity:.6;animation:drift 22s ease-in-out infinite alternate}
body::after{width:65vmax;height:65vmax;right:-20vmax;bottom:-20vmax;background:radial-gradient(circle,#6d7cff,transparent 65%);opacity:.5;animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.1)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
main{position:relative;z-index:1;width:100%;max-width:560px;padding:24px 18px 40px;display:flex;flex-direction:column;gap:18px}
h1{font-size:4rem;line-height:1;margin:-10px 0 0;text-align:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.2))}
.card{position:relative;overflow:hidden;background:var(--card);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--edge);border-radius:32px;padding:24px;text-align:center;box-shadow:0 12px 40px var(--shadow),inset 0 1px 0 var(--edge),inset 0 -1px 0 rgba(255,255,255,.12)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(145deg,var(--shine),rgba(255,255,255,0) 42%);pointer-events:none}
.card>*{position:relative}
.count{font-size:5.5rem;font-weight:800;line-height:1}
.sub{color:var(--muted);margin-top:6px}
.bar{height:14px;background:var(--track);border:1px solid var(--edge);border-radius:99px;margin-top:18px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.bar i{display:block;height:100%;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 60%),var(--blue);border-radius:99px;box-shadow:0 0 12px var(--blue);width:0;transition:width .3s}
.msg{margin-top:16px;font-size:1.05rem}
#done{position:relative;overflow:hidden;width:100%;border:1px solid rgba(255,255,255,.6);border-radius:32px;padding:32px 10px;font-size:1.5rem;font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.35);background:var(--blue);background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%),color-mix(in srgb,var(--blue) 78%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:0 12px 32px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(255,255,255,.2);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
#done:active{transform:scale(.98)}
#done:disabled{opacity:.5}
.date{font-size:2rem;font-weight:800;color:var(--accent);margin:6px 0;text-transform:capitalize}
.seg,.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
.tabs{margin:0;padding-bottom:16px;border-bottom:1px solid var(--edge)}
.views{display:grid;margin-top:20px}
.views>div{grid-area:1/1}
.views>[hidden]{display:flex;visibility:hidden}
#viewEnd,#viewPace{display:flex;flex-direction:column;gap:20px}
.views .sub{margin-top:0}
.views .date{margin:4px 0 0}
#cfg::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;background:linear-gradient(160deg,var(--shine),rgba(255,255,255,0) 42%);pointer-events:none}
.seg button,.tabs button{flex:1;border:1px solid var(--edge);background:var(--track);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--text);border-radius:99px;padding:13px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 var(--edge)}
.seg button.on,.tabs button.on{border-color:rgba(255,255,255,.7);background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),var(--accent);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.3);box-shadow:0 4px 16px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.6)}
@keyframes goalpop{0%{transform:scale(.3);opacity:0;filter:blur(4px)}55%{transform:scale(1.25);opacity:1;filter:blur(0)}75%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes goalglow{0%{box-shadow:0 0 0 0 rgba(109,124,255,.75),0 0 14px var(--blue)}100%{box-shadow:0 0 0 24px rgba(109,124,255,0),0 0 14px var(--blue)}}
#days .goal.pop{animation:goalpop .6s cubic-bezier(.2,.9,.3,1.3),goalglow .9s .25s ease-out}
@media (prefers-reduced-motion:reduce){#days .goal.pop,#days .goal.swap{animation:none}}
#days .goal{cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;white-space:nowrap}
#days .goal.alt{font-size:.92rem}
#days .goal.swap{animation:goalswap .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes goalswap{0%{transform:scale(.85);opacity:.35;filter:blur(3px)}60%{transform:scale(1.06);opacity:1;filter:blur(0)}100%{transform:none}}
.small{display:flex;justify-content:space-between;gap:10px}
.small button{flex:1;border:1px solid var(--edge);background:var(--track);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--text);border-radius:99px;padding:13px 16px;font-size:.95rem;font-weight:600;cursor:pointer;box-shadow:inset 0 1px 0 var(--edge)}
#slider{-webkit-appearance:none;appearance:none;width:100%;height:40px;margin:8px 0 2px;background:transparent;outline:none}
#slider::-webkit-slider-runnable-track{box-sizing:border-box;height:16px;border-radius:99px;border:1px solid var(--edge);background-image:linear-gradient(90deg,#8f9bff,#6d7cff),linear-gradient(var(--track),var(--track));background-repeat:no-repeat;background-size:var(--p,50%) 100%,100% 100%;box-shadow:inset 0 2px 5px rgba(0,0,0,.15)}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:40px;margin-top:-12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e4e7ff 55%,#aab3ff);border:2px solid #fff;box-shadow:0 0 0 6px rgba(109,124,255,.3),0 8px 18px rgba(0,0,0,.3);cursor:grab;transition:transform .15s}
#slider:active::-webkit-slider-thumb{transform:scale(1.15)}
#slider::-moz-range-track{height:16px;border-radius:99px;background:var(--track)}
#slider::-moz-range-progress{height:16px;border-radius:99px;background:#6d7cff}
#slider::-moz-range-thumb{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e4e7ff 55%,#aab3ff);border:2px solid #fff;box-shadow:0 0 0 6px rgba(109,124,255,.3),0 8px 18px rgba(0,0,0,.3)}
.ticks{position:absolute;left:0;right:0;top:100%;margin-top:2px;display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);padding:0 4px}
.legend{font-size:.85rem;color:var(--muted);margin-top:10px}
#done{font-size:clamp(1.8rem,6vw,2.8rem);font-weight:900;line-height:1;padding:30px 10px;letter-spacing:1px}
.plus1{display:inline-block;font-style:italic;text-shadow:0 4px 0 rgba(0,0,0,.18),0 0 24px rgba(255,255,255,.6)}
#fx{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:0}
.d{display:inline-block;height:1.05em;overflow:hidden;vertical-align:top}
.s{display:block;height:1.05em;line-height:1.05em}
.col{display:block}
.col.up{animation:rollUp .65s cubic-bezier(.2,.85,.25,1) calc(var(--k) * .07s) both}
.col.dn{animation:rollDn .65s cubic-bezier(.2,.85,.25,1) calc(var(--k) * .07s) both}
@keyframes rollUp{0%{transform:translateY(0);filter:blur(0)}45%{filter:blur(2.5px)}100%{transform:translateY(-50%);filter:blur(0)}}
@keyframes rollDn{0%{transform:translateY(-50%);filter:blur(0)}45%{filter:blur(2.5px)}100%{transform:translateY(0);filter:blur(0)}}
#left{z-index:1}
#left.tick{animation:tick .7s ease-out}
@keyframes tick{0%{transform:scale(1)}35%{transform:scale(1.08);text-shadow:0 0 28px var(--blue)}100%{transform:scale(1);text-shadow:0 0 0 transparent}}
.halo{position:absolute;left:50%;top:70px;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:radial-gradient(circle,var(--blue),transparent 70%);opacity:0;animation:halo .85s ease-out}
@keyframes halo{0%{opacity:0;transform:scale(.5)}30%{opacity:.5}100%{opacity:0;transform:scale(1.7)}}
#pct.hit{transform-origin:right center;animation:pctpop .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pctpop{0%{transform:scale(1)}30%{transform:scale(1.6);color:var(--blue);text-shadow:0 0 16px var(--blue)}60%{transform:scale(.95)}100%{transform:scale(1);text-shadow:0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){#left.tick,#pct.hit,.bar.hit{animation:none}}
@keyframes roll{0%{transform:translateY(45%) scale(.7);opacity:0;filter:blur(6px)}60%{transform:translateY(-6%) scale(1.12);opacity:1;filter:blur(0);text-shadow:0 0 30px var(--blue)}100%{transform:none;text-shadow:0 0 0 transparent}}
#done::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
#done.pop{animation:pop .3s ease}
@keyframes pop{40%{transform:scale(.94)}70%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){#done::after{animation:none}#left.roll{animation:none}}
.tabs button.on{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),var(--blue)}
.small{justify-content:center;gap:12px}
#last{text-align:center;font-size:.78rem;color:var(--muted);margin-top:-6px;min-height:1em}
.small button{flex:0 0 auto;padding:6px 16px;font-size:.78rem;font-weight:500;opacity:.5;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.count{line-height:1.05}
#leftLabel{margin-top:2px;font-size:1.1rem}
.tap{cursor:pointer;border-radius:8px;padding:2px 6px;-webkit-tap-highlight-color:transparent}
.tap:active{background:var(--track)}
#cfg{position:absolute;left:0;bottom:60px;z-index:6;display:flex;flex-direction:column;gap:10px;width:260px;max-width:calc(100% - 16px);box-sizing:border-box;padding:14px 16px;border-radius:20px;text-align:center;color:#fff;background:linear-gradient(145deg,var(--gi1),var(--gi2));-webkit-backdrop-filter:blur(44px) saturate(200%);backdrop-filter:blur(44px) saturate(200%);border:1px solid var(--edge);box-shadow:0 14px 36px var(--shadow),inset 0 1px 0 var(--edge),inset 0 -1px 0 rgba(255,255,255,.12);overflow:hidden;opacity:0;transform:translateY(8px) scale(.92);pointer-events:none;transition:opacity .2s,transform .25s cubic-bezier(.2,.9,.3,1.3)}
#cfg.show{opacity:1;transform:none;pointer-events:auto}
#cfg input[type=date]{-webkit-appearance:none;appearance:none;display:block;margin:0;min-height:46px;max-width:100%}
#cfg input::-webkit-date-and-time-value{text-align:center}
#cfg .cl{font-weight:700;font-size:.95rem}
#cfg .row{display:flex;gap:8px;align-items:center}
#cfg input{font:inherit;font-size:1.1rem;font-weight:700;text-align:center;border:0;border-radius:14px;padding:10px;background:rgba(255,255,255,.92);color:#1c1c1e;color-scheme:light;width:100%;min-width:0;box-sizing:border-box}
#cfg button{font:inherit;font-weight:700;border:1px solid rgba(255,255,255,.55);border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.22);color:#fff;cursor:pointer}
#cfg .st{width:44px;padding:10px 0;font-size:1.2rem}
#cfg .ok{background:#fff;color:#4a58d6;border-color:#fff}
#cd{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
.vsep{display:inline-block;width:1px;height:1.3em;background:var(--edge)}
.ctl{position:relative;height:52px;display:flex;align-items:center}
.ctl>.seg,.ctl>#slider{margin:0;width:100%}
#days{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}
#days .num{font-weight:900;font-size:1.15em;color:var(--blue)}
.goal{display:inline-block;padding:3px 14px;border-radius:99px;color:#fff;font-weight:800;border:1px solid rgba(255,255,255,.6);background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),var(--blue);box-shadow:0 0 14px var(--blue),inset 0 1px 0 rgba(255,255,255,.6)}
.barrow{display:flex;align-items:center;gap:12px;margin-top:18px}
.barrow .bar{flex:1;margin-top:0}
#pct{font-weight:800;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
@media (min-width:820px) and (orientation:landscape){
  main{max-width:1120px;display:grid;grid-template-columns:1fr 1fr;column-gap:22px;row-gap:18px;align-content:center;min-height:100%;box-sizing:border-box}
  h1{grid-column:1/-1}
  #c1{grid-column:1;grid-row:2}
  #done{grid-column:1;grid-row:3}
  #c2{grid-column:2;grid-row:2/4;display:flex;flex-direction:column;justify-content:flex-start}
  #c2 .views{flex:1;align-content:center;margin-top:0;margin-bottom:-24px}
  .small{grid-column:1/-1}
  #last{grid-column:1/-1}
  .count{font-size:6.5rem}
}
</style>
</head>
<body>
<main>
<h1>⏳</h1>
<div class="card" id="c1">
  <div id="fx"></div>
  <div id="cfg"></div>
  <div class="count" id="left">127</div>
  <div class="sub" id="leftLabel">cours restants</div>
  <div class="barrow"><div class="bar"><i id="bar"></i></div><span id="pct">0 %</span></div>
  <div class="msg" id="cd" style="font-weight:700;font-size:1rem;margin-top:14px"></div>
</div>
<button id="done" aria-label="Un cours de fait"><span class="plus1">COURS TERMINÉ</span></button>
<div class="card" id="c2">
  <div class="tabs"><button data-t="end" class="on">Date de fin</button><button data-t="pace">Nombre de cours par jour</button></div>
  <div class="views">
  <div id="viewEnd">
  <div style="position:relative"><div class="sub">Si tu continues à ce rythme, tu finis le</div><div class="date" id="date">–</div></div>
  <div class="sub" id="days" style="height:30px"></div>
  <div class="ctl"><div class="seg">
    <button data-r="2">2 cours / jour</button>
    <button data-r="3">3 cours / jour</button>
    <button data-r="4">4 cours / jour</button>
  </div></div>
  </div>
  <div id="viewPace" hidden>
    <div><div class="sub">Pour finir à la date choisie, il te faut</div><div class="date" id="paceNeed" style="text-transform:none">–</div></div>
    <div class="sub" id="paceSub" style="display:none"></div>
    <div style="height:30px;display:flex;justify-content:center;align-items:center"><b id="paceDate" class="goal" style="text-transform:capitalize">–</b></div>
    <div class="ctl"><input type="range" id="slider" min="0" max="14" value="8"><div class="ticks"><span>1 déc</span><span>15 déc</span></div></div>
  </div>
  </div>
  
  
</div>
<div class="small">
  <button id="undo">Annuler</button>
  <button id="reset">Réinitialiser</button>
</div>
<div id="last"></div>
</main>
<script>
var TOTAL = 127;
var examStr = "2026-12-16";
function examDate() { var q = examStr.split("-"); return new Date(+q[0], +q[1] - 1, +q[2]); }
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
var left = TOTAL, rate = 4, stamp = 0, day = "", td = 0, last = 0, dk = "", sl = 0, sr = 4;

try {
  var s = JSON.parse(localStorage.getItem("rev") || "null");
  if (s) { if (typeof s.left === "number") left = s.left; if (s.rate === 2 || s.rate === 3 || s.rate === 4) rate = s.rate; if (typeof s.t === "number") stamp = s.t; if (typeof s.day === "string") { day = s.day; td = s.td || 0; } if (typeof s.last === "number") last = s.last; if (typeof s.total === "number" && s.total >= 1) TOTAL = s.total; if (typeof s.exam === "string") examStr = s.exam; if (typeof s.dk === "string") { dk = s.dk; sl = s.sl || 0; sr = s.sr || 4; } }
} catch (e) {}
function saveLocal() { try { localStorage.setItem("rev", JSON.stringify({left: left, rate: rate, t: stamp, day: day, td: td, last: last, total: TOTAL, exam: examStr, dk: dk, sl: sl, sr: sr})); } catch (e) {} }
function save() { stamp = Date.now(); saveLocal(); pushRemote(); }

function dayKey() { var n = new Date(); return n.getFullYear() + "-" + (n.getMonth() + 1) + "-" + n.getDate(); }
function bump(n) { var k = dayKey(); if (day !== k) { day = k; td = 0; } td = Math.max(0, td + n); }
var shown = null, countT;
function setCount(n) {
  var el = document.getElementById("left"), nw = String(n);
  if (shown === nw) return;
  var old = shown; shown = nw;
  clearTimeout(countT);
  if (old === null || (window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches)) { el.textContent = nw; return; }
  var up = Number(nw) < Number(old), len = Math.max(old.length, nw.length), h = "";
  var o = old.padStart(len, " "), c = nw.padStart(len, " ");
  for (var i = 0; i < len; i++) {
    var a = o[i].trim(), b = c[i].trim(), k = len - 1 - i;
    if (a === b) h += '<span class="d"><span class="s">' + b + "</span></span>";
    else h += '<span class="d"><span class="col ' + (up ? "up" : "dn") + '" style="--k:' + k + '"><span class="s">' + (up ? a : b) + '</span><span class="s">' + (up ? b : a) + "</span></span></span>";
  }
  el.innerHTML = h;
  countT = setTimeout(function () { el.textContent = shown; }, 1000);
}
function burst() {
  var b = document.getElementById("done");
  b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
  if (window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  var box = document.getElementById("fx"), n = document.getElementById("left");
  n.classList.remove("tick"); void n.offsetWidth; n.classList.add("tick");
  box.innerHTML = '<div class="halo"></div>';
  clearTimeout(burst.t); burst.t = setTimeout(function () { box.innerHTML = ""; n.classList.remove("tick"); }, 900);
}
function checkMilestone(b, a) {
  [25, 50, 75, 100].forEach(function (p) {
    var t = Math.ceil(TOTAL * p / 100);
    if (b < t && a >= t) {
      var els = [document.getElementById("pct")];
      els.forEach(function (e) { e.classList.remove("hit"); void e.offsetWidth; e.classList.add("hit"); });
      setTimeout(function () { els.forEach(function (e) { e.classList.remove("hit"); }); }, 1000);
    }
  });
}
var curTab = "end", endColor = "var(--green)", paceColor = "var(--green)";
function applyAccent() { document.documentElement.style.setProperty("--accent", curTab === "pace" ? paceColor : endColor); }
var todayTxt = "", prevGoal = null;
function ensureBase() {
  var k = dayKey();
  if (dk !== k) { sl = left + (day === k ? td : 0); sr = rate; dk = k; }
}
function renderToday() {
  ensureBase();
  if (left === 0) { todayTxt = ""; prevGoal = null; return; }
  var tgt = Math.max(0, Math.ceil(sl / rate) - 1), rest = Math.max(0, left - tgt * rate);
  var goal = rest === 0, anim = prevGoal === false && goal; prevGoal = goal;
  if (goalAlt && (!goal || altFor !== left)) goalAlt = false;
  var nx = ((left - 1) % rate) + 1, cls = 'goal' + (anim ? ' pop' : '') + (swapNext && goal ? ' swap' : '') + (goalAlt ? ' alt' : '');
  swapNext = false;
  todayTxt = goal ? '<b class="' + cls + '">' + (goalAlt ? 'Encore ' + nx + ' cours pour finir plus tôt !' : 'Objectif atteint') + '</b>' : 'Encore <b class="num">' + rest + '</b> cours';
}
function renderLast() {
  var el = document.getElementById("last");
  if (!last) { el.textContent = ""; return; }
  var now = new Date(), then = new Date(last), txt;
  var dd = Math.round((midnight() - new Date(then.getFullYear(), then.getMonth(), then.getDate())) / 86400000);
  if (dd >= 2) txt = "il y a " + dd + " jours";
  else if (dd === 1) txt = "hier";
  else {
    var m = Math.floor((now - then) / 60000);
    txt = m < 1 ? "à l’instant" : m < 60 ? "il y a " + m + (m > 1 ? " minutes" : " minute") : "il y a " + Math.floor(m / 60) + (m >= 120 ? " heures" : " heure");
  }
  el.textContent = "Dernier cours " + txt;
}
function midnight() { var d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function countdown() {
  var today = midnight();
  function part(d, label) { var n = Math.round((d - today) / 86400000); return label + (n > 1 ? " dans " + n + " jours" : n === 1 ? " demain" : n === 0 ? " aujourd’hui" : " (passé)"); }
  
  var np = Math.round((examDate() - today) / 86400000);
  var pt = np > 1 ? "Partiels dans " + np + " jours" : np === 1 ? "Partiels demain" : np === 0 ? "Partiels aujourd’hui" : "", dn = TOTAL - left;
  document.getElementById("cd").innerHTML = '<span class="tap" data-k="total">' + dn + "/" + TOTAL + (dn > 1 ? " cours terminés" : " cours terminé") + '</span><i class="vsep"></i><span class="tap" data-k="exam">' + (pt || "Partiels passés") + "</span>";
}
function renderPace() {
  var ex = examDate(), sl = document.getElementById("slider"), sv = Number(sl.value); sl.style.setProperty("--p", (sv / 14 * 100) + "%"); var target = addDays(ex, sv - 15);
  var tk = document.querySelectorAll(".ticks span"), fm = {day: "numeric", month: "short"};
  tk[0].textContent = addDays(ex, -15).toLocaleDateString("fr-FR", fm); tk[1].textContent = addDays(ex, -1).toLocaleDateString("fr-FR", fm);
  var days = Math.round((target - midnight()) / 86400000);
  document.getElementById("paceDate").textContent = target.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
  var need = document.getElementById("paceNeed"), sub = document.getElementById("paceSub");
  need.style.color = ""; paceColor = "var(--green)";
  if (left === 0) { need.textContent = "C’est terminé !"; sub.textContent = ""; }
  else if (days < 1) { need.textContent = "Date trop proche"; sub.textContent = "Choisis une date à partir de demain."; }
  else { var n = Math.ceil(left / days); var pc = n <= 3 ? "var(--green)" : n === 4 ? "var(--orange)" : "var(--red)"; need.style.color = pc; paceColor = pc; need.textContent = n + " cours / jour"; sub.textContent = days + (days > 1 ? " jours" : " jour") + " de révision (à partir de demain)"; }
  applyAccent();
}
var remoteDoc = null, pushTimer = null, pushing = false, dirty = false;
function pushRemote() {
  if (!remoteDoc) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(flush, 500);
}
async function flush() {
  if (!remoteDoc) return;
  if (pushing) { dirty = true; return; }
  pushing = true;
  try { await remoteDoc.set({left: left, rate: rate, t: stamp, day: day, td: td, last: last, total: TOTAL, exam: examStr, dk: dk, sl: sl, sr: sr}); } catch (e) {}
  pushing = false;
  if (dirty) { dirty = false; flush(); }
}


function render() {
  var today = new Date(); today.setHours(0, 0, 0, 0);
  setCount(left);
  document.getElementById("leftLabel").textContent = left > 1 ? "cours restants" : "cours restant";
  var d = TOTAL - left;
  renderPace(); countdown(); renderToday(); renderLast();
  document.getElementById("bar").style.width = ((TOTAL - left) / TOTAL * 100) + "%";
  document.getElementById("pct").textContent = Math.round((TOTAL - left) / TOTAL * 100) + " %";
  document.getElementById("done").disabled = left === 0;

  var color = "var(--green)", dateTxt, daysTxt = "";
  if (left === 0) {
    dateTxt = "C’est terminé !";
  } else {
    var days = Math.ceil(left / rate);
    var fin = new Date(today); fin.setDate(today.getDate() + days);
    if (fin >= addDays(examDate(), -7)) { color = "var(--orange)"; }
    if (fin > addDays(examDate(), -2)) { color = "var(--red)"; }
    dateTxt = fin.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"});
    daysTxt = days + (days > 1 ? " jours de révisions" : " jour de révision");
  }
  var root = document.documentElement;
  endColor = color; applyAccent();
  document.getElementById("date").textContent = dateTxt;
  document.getElementById("days").innerHTML = todayTxt ? "<span>" + todayTxt + "</span>" : "";
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.classList.toggle("on", Number(b.dataset.r) === rate);
  });
}

document.getElementById("done").onclick = function () { if (left > 0) { var before = TOTAL - left; burst(); left--; bump(1); last = Date.now(); save(); render(); checkMilestone(before, TOTAL - left); } };
document.getElementById("undo").onclick = function () { if (left < TOTAL) { left++; bump(-1); if (left === TOTAL) last = 0; save(); render(); } };
document.getElementById("slider").oninput = renderPace;
var goalAlt = false, altFor = -1, swapNext = false, altTimer;
document.getElementById("days").onclick = function (e) {
  if (!(e.target.closest && e.target.closest(".goal"))) return;
  goalAlt = !goalAlt; altFor = left; swapNext = true;
  clearTimeout(altTimer);
  if (goalAlt) altTimer = setTimeout(function () { goalAlt = false; swapNext = true; render(); }, 6000);
  render();
};
var cfg = document.getElementById("cfg"), cfgKind = null;
function hideCfg() { cfg.classList.remove("show"); cfgKind = null; }
function openCfg(kind, target) {
  if (cfg.classList.contains("show") && cfgKind === kind) { hideCfg(); return; }
  cfgKind = kind;
  var done = TOTAL - left;
  if (kind === "total") cfg.innerHTML = '<div class="cl">Cours dans le semestre</div><div class="row"><button class="st" data-d="-1">−</button><input id="cfgIn" type="number" inputmode="numeric" min="' + Math.max(1, done) + '" max="999" value="' + TOTAL + '"><button class="st" data-d="1">+</button></div><button class="ok">Valider</button>';
  else cfg.innerHTML = '<div class="cl">Date des partiels</div><input id="cfgIn" type="date" value="' + examStr + '"><button class="ok">Valider</button>';
  var cr = document.getElementById("c1").getBoundingClientRect(), tr = target.getBoundingClientRect();
  var w = cfg.offsetWidth, center = tr.left + tr.width / 2 - cr.left;
  var l = Math.max(8, Math.min(cr.width - w - 8, center - w / 2));
  cfg.style.left = l + "px"; cfg.style.bottom = (cr.bottom - tr.top + 12) + "px"; cfg.style.setProperty("--ax", (center - l) + "px");
  cfg.classList.add("show");
}
cfg.onclick = function (e) {
  e.stopPropagation();
  var t = e.target, inp = document.getElementById("cfgIn");
  if (t.classList.contains("st")) { inp.value = Math.max(Number(inp.min) || 1, (Number(inp.value) || 0) + Number(t.dataset.d)); return; }
  if (!t.classList.contains("ok")) return;
  if (cfgKind === "total") {
    var n = Math.round(Number(inp.value));
    if (!(n >= 1)) return;
    n = Math.max(n, TOTAL - left, 1);
    sl += n - TOTAL; left += n - TOTAL; TOTAL = n;
  } else if (/^\d{4}-\d{2}-\d{2}$/.test(inp.value)) { examStr = inp.value; }
  else return;
  hideCfg(); save(); render();
};
document.getElementById("cd").onclick = function (e) {
  var t = e.target.closest ? e.target.closest(".tap") : null;
  if (t) openCfg(t.dataset.k, t);
};
document.addEventListener("click", function (e) { if (!cfg.contains(e.target) && !(e.target.closest && e.target.closest(".tap"))) hideCfg(); }, true);
setInterval(renderLast, 30000);
document.querySelectorAll(".tabs button").forEach(function (b) {
  b.onclick = function () {
    var pace = b.dataset.t === "pace"; curTab = pace ? "pace" : "end"; applyAccent();
    document.getElementById("viewEnd").hidden = pace;
    document.getElementById("viewPace").hidden = !pace;
    document.querySelectorAll(".tabs button").forEach(function (x) { x.classList.toggle("on", x === b); });
  };
});
var resetBtn = document.getElementById("reset"), resetTimer = null;
resetBtn.onclick = function () {
  if (resetTimer) {
    clearTimeout(resetTimer); resetTimer = null;
    resetBtn.textContent = "Réinitialiser";
    left = TOTAL; day = ""; td = 0; last = 0; dk = ""; save(); render();
    return;
  }
  resetBtn.textContent = "Appuie encore pour confirmer";
  resetTimer = setTimeout(function () {
    resetTimer = null;
    resetBtn.textContent = "Réinitialiser";
  }, 3000);
};
document.querySelectorAll(".seg button").forEach(function (b) {
  b.onclick = function () { rate = Number(b.dataset.r); save(); render(); };
});
render();

(async function () {
  try {
    if (!window.claude || !claude.use) return;
    var db = await claude.use("db"), user = await claude.use("user");
    if (!db || !user) return;
    var id = await user.id();
    if (!id) return;
    var ref = db.collection("data/users/" + id).doc("progress");
    var snap = await ref.get();
    remoteDoc = ref;
    var r = snap.exists ? snap.data() : null;
    if (r && typeof r.t === "number" && typeof r.left === "number" && r.t > stamp) {
      if (typeof r.total === "number" && r.total >= 1) TOTAL = r.total; if (typeof r.exam === "string") examStr = r.exam; if (typeof r.dk === "string") { dk = r.dk; sl = r.sl || 0; sr = r.sr || 4; }
      left = Math.max(0, Math.min(TOTAL, r.left));
      if (r.rate === 2 || r.rate === 3 || r.rate === 4) rate = r.rate;
      stamp = r.t; if (typeof r.day === "string") { day = r.day; td = r.td || 0; } if (typeof r.last === "number") last = r.last;
      saveLocal();
      render();
    } else if (left !== TOTAL || stamp > 0) {
      stamp = stamp || Date.now();
      flush();
    }
  } catch (e) {}
})();
</script>
</body>
</html>
